<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d14">
  <meta name="description" content="MEDBI Football Live — futebol ao vivo, jogos e canais oficiais.">
  <title>MEDBI Football Live</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="menuButton" aria-label="Abrir menu">☰</button>
    <a class="brand" href="#" data-page="inicio"><span class="brand-mark">M</span><span>MEDBI <b>FOOTBALL</b></span></a>
    <button class="icon-btn" id="searchToggle" aria-label="Pesquisar">⌕</button>
  </header>

  <div class="search-panel" id="searchPanel">
    <input id="searchInput" type="search" placeholder="Pesquisar equipa ou competição...">
    <button id="clearSearch" class="icon-btn" aria-label="Limpar pesquisa">×</button>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="side-head"><span class="brand-mark">M</span><strong>MEDBI Football Live</strong><button id="closeMenu" class="icon-btn">×</button></div>
    <nav>
      <button data-page="inicio" class="nav-item active">⌂ <span>Início</span></button>
      <button data-page="ao-vivo" class="nav-item">● <span>Ao vivo</span></button>
      <button data-page="jogos" class="nav-item">▦ <span>Todos os jogos</span></button>
      <button data-page="competicoes" class="nav-item">♜ <span>Competições</span></button>
      <button data-page="canais" class="nav-item">▣ <span>Canais</span></button>
      <button data-page="favoritos" class="nav-item">★ <span>Favoritos</span></button>
      <button data-page="sobre" class="nav-item">ⓘ <span>Sobre</span></button>
    </nav>
    <p class="side-note">Futebol da Guiné-Bissau e do mundo.</p>
  </aside>

  <main class="main" id="pageContent">
    <div class="loading">A preparar o MEDBI Football Live...</div>
  </main>

  <nav class="bottom-nav">
    <button data-page="inicio" class="active"><span>⌂</span>Início</button>
    <button data-page="ao-vivo"><span>●</span>Ao vivo</button>
    <button data-page="jogos"><span>▦</span>Jogos</button>
    <button data-page="favoritos"><span>★</span>Favoritos</button>
  </nav>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
